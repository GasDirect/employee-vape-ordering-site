name: Catalog Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    name: Validate product catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python3 tools/validate_catalog.py

      - name: Verify 182 Foger images and Kit/Pod mappings
        run: python3 tools/verify_foger_images.py

      - name: Test website, email backend, and cache isolation
        run: |
          node tests/smoke_test.js
          node tests/backend_smoke_test.js
          node tests/sw_smoke_test.js
