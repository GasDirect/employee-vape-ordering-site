name: Generate Email Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_email_thumbnails.py'
      - 'data/products.json'
      - 'assets/products/**'
      - '.github/workflows/email-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-thumbnails-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate opaque email thumbnails
        run: python tools/generate_email_thumbnails.py
      - name: Validate thumbnail output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          catalog = json.loads(Path("data/products.json").read_text())["products"]
          source_images = {p["image"] for p in catalog if p.get("image", "").startswith("assets/products/")}
          for src in source_images:
              path = Path("assets/email-thumbnails") / Path(src).relative_to("assets/products")
              path = path.with_suffix(".png")
              assert path.exists(), f"Missing email thumbnail: {path}"
              with Image.open(path) as img:
                  assert img.format == "PNG" and img.mode == "RGB" and img.size == (192, 192), str(path)
                  assert img.getpixel((0,0)) == (255,255,255), str(path)
          print("Validated", len(source_images), "opaque PNG email thumbnails")
          PY
      - name: Commit generated image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/email-thumbnails/
          if git diff --cached --quiet; then
            echo "Email thumbnails are already current."
          else
            git commit -m "Generate opaque email PNG thumbnails [skip ci]"
            git push origin HEAD:main
          fi
